services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sweet-panda-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell or .env file}
    ports:
      - "1433:1433"
    volumes:
      - sweet-panda-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  sweet-panda-sql-data:
